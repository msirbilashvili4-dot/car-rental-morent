<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo-search-wrapper">
                <div class="logo">
                    <a href="index.html">
                        <img src="assets/images/icons/logo.svg" alt="morent logo">
                    </a>
                </div>
            </div>
            <div class="cta-wrapper">
                <div class="cta">
                    <img src="assets/images/icons/heart.png" alt="heart icon">
                </div>
                <div class="cta">
                    <img src="assets/images/icons/notification.png" alt="notification icon">
                </div>
                <div class="cta">
                    <img src="assets/images/icons/settings.png" alt="settings icon">
                </div>
                <div class="cta">
                    <img src="assets/images/icons/profile-picture.png" alt="profile picture">
                </div>
            </div>
        </header>
    </div>

    <section class="checkout">
        <main>
            <form>
                <fieldset>
                    <div> 
                        <legend>billing info</legend>
                    </div>
                    <!-- <h2>Billing Info</h2> -->
                    <div class="flex justify-between ">
                        <p>Please enter your billing info</p>
                        <span>Step 1 of 4</span>
                    </div>
                    
                    <div class="grid">
                        <div>
                            <label for="name">Name</label>
                            <input type="text" id="name" placeholder="Your name">
                        </div>
                        <div>
                            <label for="adress">Adress</label>
                            <input type="text" id="adress" placeholder="Adress">
                        </div>
                        <div>
                            <label for="phone">Phone Number</label>
                            <input type="text" id="phone" placeholder="Phone number">
                        </div>
                        <div>
                            <label for="city">Town/City</label>
                            <input type="text"id="city" placeholder="Town or City">
                        </div>
                        
                    </div>

                </fieldset>

            </form>
        </main>

        <aside>

        </aside>
    </section>

</body>

</html>
